name: QGIS plugin repository checker

on:
  push:
    branches: [master]
    paths:
      - "**.py"
      - "**/metadata.txt"
      - "**/.bandit"
      - "**/.flake8"
      - "**/.secrets.baseline"
      - ".github/workflows/qgis-plugin-checker.yml"
  workflow_dispatch:

jobs:
  qgis-plugin-checker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .   # folder holding metadata.txt
    steps:
      - uses: actions/checkout@v4

      - name: Install scanners
        run: pip install bandit detect-secrets flake8

      - name: Locate config files (plugin folder first, then repo root)
        run: |
          find_cfg() { [ -f "$1" ] && echo "$PWD/$1" || { [ -f "$GITHUB_WORKSPACE/$1" ] && echo "$GITHUB_WORKSPACE/$1"; }; }
          {
            echo "BANDIT_INI=$(find_cfg .bandit)"
            echo "FLAKE8_CFG=$(find_cfg .flake8)"
            echo "SECRETS_BASELINE=$(find_cfg .secrets.baseline)"
          } | tee -a "$GITHUB_ENV"
          for f in .bandit .flake8 .secrets.baseline; do
            [ -f "$f" ] || [ ! -f "$GITHUB_WORKSPACE/$f" ] \
              || echo "::warning::$f sits in the repository root — plugins.qgis.org only detects it next to metadata.txt"
          done

      - name: Check metadata.txt (blocking)
        run: |
          for key in name qgisMinimumVersion description about version author email repository tracker; do
            grep -qE "^\s*$key\s*=\s*\S" metadata.txt || echo "missing: $key" >> metadata_report.log
          done
          [ ! -s metadata_report.log ] || { printf '### metadata.txt\n```\n%s\n```\n' "$(cat metadata_report.log)" >> "$GITHUB_STEP_SUMMARY"; exit 1; }

      - name: Bandit (blocking) — skips read from .bandit
        run: |
          bandit -rq . --severity-level high ${BANDIT_INI:+--ini "$BANDIT_INI"} \
            --format custom --msg-template "{relpath}:{line}: {test_id} {msg}" > bandit_report.log \
            || { printf '### Bandit\n```\n%s\n```\n' "$(cat bandit_report.log)" >> "$GITHUB_STEP_SUMMARY"; exit 1; }

      - name: detect-secrets (blocking) — known findings read from .secrets.baseline
        run: |
          detect-secrets scan . --all-files --exclude-files '(^|/)(\.git/|\.secrets\.baseline$)' > /tmp/scan.json
          python - <<'EOF' > secrets_report.log
          import json, os
          plugin = os.path.basename(os.getcwd())

          def norm(path):                      # baselines generated from the repo root
              path = path[2:] if path.startswith("./") else path
              prefix = plugin + "/"            # carry a "./" prefix the scan lacks
              return path[len(prefix):] if path.startswith(prefix) else path

          baseline = os.environ.get("SECRETS_BASELINE", "")
          known = set()
          if baseline and os.path.exists(baseline):
              for f, items in json.load(open(baseline)).get("results", {}).items():
                  # File + hash only: line numbers move when code above a secret
                  # changes, and a baselined secret must not resurface as new.
                  known |= {(norm(f), s["hashed_secret"]) for s in items}

          for f, items in json.load(open("/tmp/scan.json"))["results"].items():
              for s in items:
                  if (norm(f), s["hashed_secret"]) not in known:
                      print(f'{norm(f)}:{s["line_number"]}: {s["type"]}')
          EOF
          [ ! -s secrets_report.log ] || { printf '### detect-secrets (add to .secrets.baseline if false positive)\n```\n%s\n```\n' "$(cat secrets_report.log)" >> "$GITHUB_STEP_SUMMARY"; exit 1; }

      - name: Flake8 (informational) — ignores read from .flake8
        run: |
          flake8 . --exit-zero ${FLAKE8_CFG:+--config "$FLAKE8_CFG"} > flake8_report.log
          [ ! -s flake8_report.log ] || printf '<details><summary>Flake8 (informational, non-blocking)</summary>\n\n```\n%s\n```\n\n</details>\n' "$(cat flake8_report.log)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports when failure appears
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qgis-plugin-checker-reports
          path: ./*_report.log