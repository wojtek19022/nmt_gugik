name: QGIS Plugin QA

# Mirrors the scan plugins.qgis.org runs on upload:
# https://plugins.qgis.org/docs/security-scanning
#   Bandit + detect-secrets = CRITICAL, blocking  -> job fails
#   Flake8 + file analysis  = informational       -> reported only
#
# Suppress false positives with .bandit / .secrets.baseline / .flake8 placed
# next to the plugin's metadata.txt. They are picked up automatically.

on:
  push:
    branches: [master]   # covers direct pushes and merges into master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [.]   # add more folder names here if the repo holds several
    defaults:
      run:
        working-directory: ${{ matrix.plugin }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scanners
        run: pip install bandit==1.8.3 detect-secrets==1.5.0 flake8==7.1.1

      - name: Heading
        run: echo "# QGIS QA — \`${{ matrix.plugin }}\`" >> "$GITHUB_STEP_SUMMARY"

      # --- structural validation: the site rejects the upload without these ---
      - name: Check metadata.txt
        id: metadata
        continue-on-error: true
        run: |
          missing=""
          for key in name qgisMinimumVersion description about version author email repository tracker; do
            grep -qE "^\s*$key\s*=\s*\S" metadata.txt || missing="$missing $key"
          done
          test -f __init__.py || missing="$missing __init__.py"
          if [ -z "$missing" ]; then
            printf '✅ **metadata.txt** — all required fields present\n\n' >> "$GITHUB_STEP_SUMMARY"
          else
            printf '❌ **metadata.txt** — missing:%s\n\n' "$missing" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::metadata.txt is missing:$missing"
            exit 1
          fi

      # --- BLOCKING: Bandit (uses .bandit if present) ---
      - name: Bandit
        id: bandit
        continue-on-error: true
        run: |
          INI=""
          if [ -f .bandit ]; then INI="--ini .bandit"; fi
          if bandit -r . --severity-level high $INI > /tmp/bandit.txt 2>&1; then
            printf '✅ **Bandit** — no CRITICAL findings\n\n' >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "❌ **Bandit** — blocking findings"
              echo ""
              echo "<details><summary>Report</summary>"
              echo ""
              echo '```'
              cat /tmp/bandit.txt
              echo '```'
              echo ""
              echo "</details>"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/bandit.txt
            echo "::error::Bandit found CRITICAL issues — fix them, or skip audited tests via .bandit"
            exit 1
          fi

      # --- BLOCKING: detect-secrets (uses .secrets.baseline if present) ---
      - name: detect-secrets
        id: secrets
        continue-on-error: true
        run: |
          if [ -f .secrets.baseline ]; then
            cp .secrets.baseline /tmp/base.json
            detect-secrets scan --baseline .secrets.baseline --all-files
            cp .secrets.baseline /tmp/new.json
            cp /tmp/base.json .secrets.baseline   # the scan rewrites the timestamp; undo it
          else
            echo '{"results": {}}' > /tmp/base.json
            detect-secrets scan . --all-files > /tmp/new.json
          fi
          python - <<'EOF'
          import json, os, sys

          def results(path):
              return json.load(open(path)).get("results", {})

          # Match on file + hash only. Line numbers shift whenever code above a
          # secret changes, and detect-secrets ignores that too — including the
          # line number here would flag already-baselined secrets as new.
          known = {(f, s["hashed_secret"])
                   for f, items in results("/tmp/base.json").items() for s in items}
          new = [(f, s) for f, items in results("/tmp/new.json").items() for s in items
                 if (f, s["hashed_secret"]) not in known]

          summary = open(os.environ.get("GITHUB_STEP_SUMMARY", os.devnull), "a")
          if not new:
              summary.write("✅ **detect-secrets** — no new secrets\n\n")
              sys.exit(0)

          summary.write(f"❌ **detect-secrets** — {len(new)} new finding(s)\n\n")
          summary.write("| File | Line | Type |\n|---|---|---|\n")
          for f, s in sorted(new, key=lambda x: (x[0], x[1]["line_number"])):
              line, kind = s["line_number"], s["type"]
              print(f"::error file={f},line={line}::detect-secrets: {kind} at {f}:{line}")
              summary.write(f"| `{f}` | {line} | {kind} |\n")
          summary.write(
              "\nIf these are false positives, regenerate the baseline from inside "
              "the plugin folder and commit it:\n\n"
              "```\ndetect-secrets scan . --all-files > .secrets.baseline\n```\n\n")
          sys.exit(1)
          EOF

      # --- informational: never blocks, exactly like on the server ---
      - name: Flake8
        if: always()
        run: |
          flake8 . --exit-zero --statistics --count > /tmp/flake8.txt 2>&1 || true
          count=$(tail -1 /tmp/flake8.txt | grep -oE '^[0-9]+' || echo 0)
          {
            if [ "$count" = "0" ]; then
              printf '✅ **Flake8** — clean _(informational)_\n\n'
            else
              echo "ℹ️ **Flake8** — $count finding(s), non-blocking"
              echo ""
              echo "<details><summary>Report</summary>"
              echo ""
              echo '```'
              head -100 /tmp/flake8.txt
              echo '```'
              echo ""
              echo "</details>"
              echo ""
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/flake8.txt

      - name: File analysis
        if: always()
        run: |
          find . -path ./.git -prune -o -type f \
            \( -perm -u+x -o -name '.*' -o -name '*.so' -o -name '*.pyd' -o -name '*.dll' \
               -o -name '*.exe' -o -name '*.sh' -o -name '*.bat' -o -name '*.pyc' \) -print \
            | grep -vE '/\.(bandit|flake8|secrets\.baseline|gitignore)$' > /tmp/files.txt || true
          count=$(wc -l < /tmp/files.txt)
          {
            if [ "$count" = "0" ]; then
              printf '✅ **File analysis** — nothing suspicious _(informational)_\n\n'
            else
              echo "⚠️ **File analysis** — $count suspicious file(s), non-blocking"
              echo ""
              sed 's|^|- `|; s|$|`|' /tmp/files.txt
              echo ""
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          sed 's|^|::warning::suspicious file: |' /tmp/files.txt

      # --- package it the way the site expects, dotfiles included ---
      - name: Build ZIP
        if: always()
        run: cd .. && zip -qr "${{ matrix.plugin }}.zip" "${{ matrix.plugin }}" -x '*.git*' '*__pycache__*'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.plugin }}-zip
          path: ${{ matrix.plugin }}.zip

      # --- verdict: fails the job only when a BLOCKING check failed ----------
      - name: Result
        if: always()
        run: |
          m="${{ steps.metadata.outcome }}"
          b="${{ steps.bandit.outcome }}"
          s="${{ steps.secrets.outcome }}"
          {
            echo ""
            echo "| Blocking check | Status |"
            echo "|---|---|"
            echo "| metadata.txt | $([ "$m" = success ] && echo '✅ passed' || echo '❌ failed') |"
            echo "| Bandit | $([ "$b" = success ] && echo '✅ passed' || echo '❌ failed') |"
            echo "| detect-secrets | $([ "$s" = success ] && echo '✅ passed' || echo '❌ failed') |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$m$b$s" = "successsuccesssuccess" ]; then
            cfg=""
            for f in .bandit .secrets.baseline .flake8; do [ -f "$f" ] && cfg="$cfg $f"; done
            if [ -n "$cfg" ]; then
              echo "## ✅ Passed — expected status: Validated (configured)" >> "$GITHUB_STEP_SUMMARY"
              echo "Config files in use:$cfg" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "## ✅ Passed — expected status: Validated" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::notice::All blocking checks passed — plugin meets the QGIS repository requirements"
          else
            echo "## ❌ Failed — this version would be BLOCKED by plugins.qgis.org" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi